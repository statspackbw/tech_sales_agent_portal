services:
  - type: web
    name: statspack-agent-portal
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      # Paste your Neon connection string here in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Free key from https://www.exchangerate-api.com/ — enables live rates.
      - key: EXCHANGERATE_API_KEY
        sync: false
      # Supabase connection string — enables the standby mirror.
      - key: MIRROR_DATABASE_URL
        sync: false
      - key: MIRROR_INTERVAL_MINUTES
        value: "60"
      - key: DB_QUOTA_MB
        value: "500"
      - key: MIRROR_QUOTA_MB
        value: "500"
      # Keep the database awake during working hours only. A 24/7 window would
      # exhaust Neon's free compute allowance and suspend the database.
      - key: KEEPALIVE_START_HOUR
        value: "6"
      - key: KEEPALIVE_END_HOUR
        value: "19"
      - key: KEEPALIVE_DAYS
        value: "0,1,2,3,4"
      - key: KEEPALIVE_TZ_OFFSET
        value: "2"
