<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3E5F71">
<title>StatsPack Tech Sales Agent Portal</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/logo.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="side-brand">
      <div class="lockup lockup-sm">
        <img src="/logo.png" alt="StatsPack"
             onerror="this.remove();document.getElementById('sideFallback').classList.remove('hidden')">
        <span id="sideFallback" class="hidden" style="display:contents">
          <span class="hat-lg"></span>
          <span class="wordmark"><b>STATS</b><span>PACK</span></span>
        </span>
      </div>
    </div>
    <div class="side-profile">
      <div class="avatar" id="avatar">–</div>
      <div class="who" id="whoName">…</div>
      <div class="sub" id="whoSub"></div>
      <div class="role" id="whoRole"></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><span id="verLabel"></span></div>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <div class="main">
    <header class="topbar">
      <button class="burger" id="burger" aria-label="Open menu">☰</button>
      <h1><span class="tic" id="pageIcon">▦</span><span id="pageTitle">Dashboard</span></h1>
      <span class="spacer"></span>
      <span class="chip" id="engineChip"></span>
    </header>
    <main class="content" id="view">
      <div class="loader"><div class="loader-chart"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="loader-text">Loading…</div></div>
    </main>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toasts"></div>
<script src="/app.js"></script>
</body>
</html>
