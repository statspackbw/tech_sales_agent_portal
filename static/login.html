<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3E5F71">
<title>Sign in · StatsPack Tech Sales Agent Portal</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/logo.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="login-wrap">
  <form class="login-card" id="form" autocomplete="on">

    <div class="lockup">
      <img src="/logo.png" alt="StatsPack"
           onerror="this.remove();document.getElementById('fallback').classList.remove('hidden')">
      <span id="fallback" class="hidden" style="display:contents">
        <span class="hat-lg"></span>
        <span class="wordmark"><b>STATS</b><span>PACK</span></span>
      </span>
    </div>

    <h1 class="login-title">Agent <em>Portal</em></h1>

    <div class="field">
      <label for="email">Email address</label>
      <span class="field-ic">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="2"></rect>
          <path d="m22 7-10 6L2 7"></path>
        </svg>
      </span>
      <input class="pill" id="email" type="email" name="email" required
             autocomplete="username" placeholder="Email">
    </div>

    <div class="field">
      <label for="password">Password</label>
      <span class="field-ic">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </span>
      <input class="pill" id="password" type="password" name="password" required
             autocomplete="current-password" placeholder="Password">
      <button class="eye" id="eye" type="button" aria-label="Show password" title="Show password">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" id="eyeIcon">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </button>
    </div>

    <p id="err" class="hidden" style="background:#FBE4DE;color:#A8412A;padding:12px 16px;
       border-radius:12px;font-size:14px;margin-bottom:14px;text-align:center"></p>

    <button class="btn-primary" id="go" type="submit">Sign In</button>
    <p class="login-foot" id="foot">Tech Sales Agent Portal</p>
  </form>
</div>

<script>
const $ = id => document.getElementById(id);
const eye = $('eye'), pw = $('password'), icon = $('eyeIcon');

eye.onclick = () => {
  const show = pw.type === 'password';
  pw.type = show ? 'text' : 'password';
  eye.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  eye.title = show ? 'Hide password' : 'Show password';
  icon.innerHTML = show
    ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>'
    : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
  pw.focus();
};

if (localStorage.getItem('sp_token')) location.replace('/');

fetch('/api/health').then(r => r.json())
  .then(h => { $('foot').textContent = 'Tech Sales Agent Portal · ' + h.version; })
  .catch(() => {});

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('go'), err = $('err');
  err.classList.add('hidden');
  btn.disabled = true;
  btn.innerHTML = '<span class="loader-inline"><i></i><i></i><i></i><i></i></span> Signing in…';
  try {
    const r = await fetch('/api/login', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email: $('email').value.trim(), password: pw.value})
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Sign-in failed.');
    localStorage.setItem('sp_token', d.token);
    localStorage.setItem('sp_user', JSON.stringify(d.user));
    location.replace('/');
  } catch (ex) {
    err.textContent = ex.message;
    err.classList.remove('hidden');
    btn.disabled = false; btn.textContent = 'Sign In';
    pw.select();
  }
});
</script>
</body>
</html>
